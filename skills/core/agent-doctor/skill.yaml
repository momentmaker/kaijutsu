name: agent-doctor
version: 0.2.0
license: MIT
layout: rich
description: "Diagnostic + cleanup tool for AI agent state directories. Audits ~/.claude, ~/.codex, ~/.gemini, ~/.agents; surfaces stale sessions, orphaned cache, broken hook refs; reclaims space safely (trash-not-delete, 30-day recovery). Ships scripts/{lib,doctor,cleanup}.sh, references/{directory-map,cleanup-tiers,protected-paths}.md, runbooks/recover-from-trash.md."
homepage: https://kaijutsu.dev/skills/agent-doctor
repository: https://github.com/momentmaker/kaijutsu
tags: [maintenance, cleanup, disk-space]
agents: [claude, codex, gemini]
shared: [scripts, references, runbooks]
permissions:
  bash: true
  network: false
  fs-write: scoped
