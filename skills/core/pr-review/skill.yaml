name: pr-review
version: 1.0.1
license: MIT
layout: rich
description: "Adversarial multi-agent PR review. Runs claude / codex / gemini in parallel via `jutsu swarm pr-review`, each with a tailored prompt, then synthesizes into a single markdown review with a disagreement table. --full mode adds a Pass-2 round-robin debate. Posts the result as a PR comment when --post-comment is set."
homepage: https://kaijutsu.dev/skills/pr-review
repository: https://github.com/momentmaker/kaijutsu
tags: [code-review, pull-request, github, multi-agent, adversarial]
agents: [claude, codex, gemini]
shared: [scripts, prompts, references, runbooks]
deps:
  skills:
    - blunder-hunt@^0.2
    - dispatch-parallel@^0.2
permissions:
  bash: true
  network: true
  fs-write: scoped
