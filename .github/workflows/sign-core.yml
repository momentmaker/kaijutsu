name: Sign core skills

# Signs every skills/core/<name>/ as a tar.gz with Sigstore keyless OIDC,
# uploads the signature bundles to the GitHub release matching the tag.
# Triggered by the same v*.*.* tags that drive release-jutsu.yml.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write   # required for keyless cosign signing
  contents: write   # required to upload assets to the release

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign each skills/core/* and upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          shopt -s nullglob
          for skill_dir in skills/core/*/; do
            name=$(basename "$skill_dir")
            archive="dist/${name}-${TAG}.tar.gz"
            tar -czf "$archive" -C skills/core "$name"

            cosign sign-blob \
              --bundle "${archive}.sig" \
              --yes \
              "$archive"

            gh release upload "$TAG" \
              "$archive" "${archive}.sig" \
              --clobber
          done

          echo "Signed and uploaded:"
          ls -la dist/
