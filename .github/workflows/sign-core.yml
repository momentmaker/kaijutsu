name: Sign core skills

# Signs every skills/core/<name>/ as a tar.gz with Sigstore keyless OIDC,
# uploads the signature bundles to the GitHub release. Triggered by the
# completion of release-jutsu.yml (which creates the release via
# goreleaser). Direct `release: published` doesn't fire reliably because
# releases created by GITHUB_TOKEN don't propagate event triggers — a
# documented GitHub Actions safety feature. workflow_run sidesteps that.
#
# workflow_dispatch is also enabled so any already-published release tag
# can be re-signed manually.

on:
  workflow_run:
    workflows: ["Release jutsu"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to sign (e.g., v0.2.0). Required for manual runs."
        required: true

permissions:
  id-token: write   # required for keyless cosign signing
  contents: write   # required to upload assets to the release

jobs:
  sign:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_HEAD: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            # workflow_run path — release-jutsu only runs on tag pushes,
            # so head_branch is the tag ref name (e.g., v0.2.0).
            TAG="$WORKFLOW_RUN_HEAD"
          fi
          if [ -z "$TAG" ]; then
            echo "Could not resolve tag from inputs or triggering workflow." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign each skills/core/* and upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          shopt -s nullglob
          for skill_dir in skills/core/*/; do
            name=$(basename "$skill_dir")
            archive="dist/${name}-${TAG}.tar.gz"
            tar -czf "$archive" -C skills/core "$name"

            cosign sign-blob \
              --bundle "${archive}.sig" \
              --yes \
              "$archive"

            gh release upload "$TAG" \
              "$archive" "${archive}.sig" \
              --clobber
          done

          echo "Signed and uploaded:"
          ls -la dist/
